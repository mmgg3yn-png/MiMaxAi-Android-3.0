plugins { id 'com.android.application' }

android {
    // Release lintVital resolves optional analyzer artifacts from Maven Central.
    // Keep APK packaging independent from transient Maven rate limits; Java compilation remains enabled.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    namespace 'com.mimax.localrunner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mimax.localrunner'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    flavorDimensions += 'projectType'
    productFlavors {
        html {
            dimension 'projectType'
            applicationIdSuffix '.html'
        }
        python {
            dimension 'projectType'
            applicationIdSuffix '.python'
        }
    }
}

name: Mi_Max Ai 3.2 Android Build
# Rebuild local HTML/Python APK templates after package and alignment fixes

on:
  push:
    branches: [ main, development, 'feature/local-html-python-apk', 'feature/mimaxai-3.1-complete-upgrade', 'feature/mimaxai-3.2-full-upgrade' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimaxai-android-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate PC Bridge Python
        run: python -m py_compile pc-agent/mimax_pc_agent.py && python pc-agent/mimax_pc_agent.py --help

      # Build reusable WebView shells in CI. Actual HTML/Python project APKs are
      # assembled and signed locally on the Android device by Mi_Max Ai.
      - name: Build local HTML and Python runner shells
        run: |
          gradle --no-daemon -p local-runner :app:assembleHtmlDebug :app:assemblePythonDebug
          mkdir -p app/src/main/assets
          cp local-runner/app/build/outputs/apk/html/debug/app-html-debug.apk app/src/main/assets/local_runner_html.apk
          cp local-runner/app/build/outputs/apk/python/debug/app-python-debug.apk app/src/main/assets/local_runner_python.apk

      - name: Bundle EROFS extraction engines (ARM32 + ARM64)
        run: |
          set -euo pipefail
          mkdir -p /tmp/erofs-arm32 /tmp/erofs-arm64
          curl -fL --retry 3 'https://github.com/sekaiacg/erofs-tools/releases/download/v1.8.10-251217/erofs-utils-v1.8.10-gee46dd74-251217-Android_armeabi-v7a.zip' -o /tmp/erofs-arm32.zip
          curl -fL --retry 3 'https://github.com/sekaiacg/erofs-tools/releases/download/v1.8.10-251217/erofs-utils-v1.8.10-gee46dd74-251217-Android_arm64-v8a.zip' -o /tmp/erofs-arm64.zip
          echo 'a5b7606bc82e1a4d7890db617f00df25f9d76a3ef85f31af9157d77a152d5f7d  /tmp/erofs-arm32.zip' > /tmp/arm32.sha
          echo '986a3880b7afc0b5efcc58f75268f2c9d03d86773ae8b7ab2c8692215740e21e  /tmp/erofs-arm64.zip' > /tmp/arm64.sha
          cat /tmp/arm32.sha /tmp/arm64.sha | sha256sum -c -
          unzip -q /tmp/erofs-arm32.zip -d /tmp/erofs-arm32
          unzip -q /tmp/erofs-arm64.zip -d /tmp/erofs-arm64
          A32="$(find /tmp/erofs-arm32 -type f -name extract.erofs -print -quit)"
          A64="$(find /tmp/erofs-arm64 -type f -name extract.erofs -print -quit)"
          test -n "$A32" && test -n "$A64"
          mkdir -p app/src/main/assets/engines/erofs/armeabi-v7a app/src/main/assets/engines/erofs/arm64-v8a
          cp "$A32" app/src/main/assets/engines/erofs/armeabi-v7a/extract.erofs
          cp "$A64" app/src/main/assets/engines/erofs/arm64-v8a/extract.erofs
          find /tmp/erofs-arm32 -type f -name '*.so*' -exec cp -L {} app/src/main/assets/engines/erofs/armeabi-v7a/ \;
          find /tmp/erofs-arm64 -type f -name '*.so*' -exec cp -L {} app/src/main/assets/engines/erofs/arm64-v8a/ \;
          chmod 0644 app/src/main/assets/engines/erofs/*/*
          file app/src/main/assets/engines/erofs/*/*
          readelf -h app/src/main/assets/engines/erofs/armeabi-v7a/extract.erofs | grep -E 'Class:|Machine:'
          readelf -h app/src/main/assets/engines/erofs/arm64-v8a/extract.erofs | grep -E 'Class:|Machine:'
          readelf -h app/src/main/assets/engines/erofs/armeabi-v7a/extract.erofs | grep -q 'ARM'
          readelf -h app/src/main/assets/engines/erofs/arm64-v8a/extract.erofs | grep -q 'AArch64'

          # Build a real EROFS image, extract it, and compare the extracted file byte-for-byte.
          curl -fL --retry 3 'https://github.com/sekaiacg/erofs-tools/releases/download/v1.8.10-251217/erofs-utils-v1.8.10-gee46dd74-251217-Linux_x86_64.zip' -o /tmp/erofs-linux.zip
          echo '6d6c6b0e7ad7273cc019644e5d6ad1e263142fad72874e169cc0731854f95bf1  /tmp/erofs-linux.zip' | sha256sum -c -
          mkdir -p /tmp/erofs-linux /tmp/erofs-fixture/src/sub /tmp/erofs-fixture/out
          unzip -q /tmp/erofs-linux.zip -d /tmp/erofs-linux
          MKFS="$(find /tmp/erofs-linux -type f -name mkfs.erofs -print -quit)"
          EXTRACT="$(find /tmp/erofs-linux -type f -name extract.erofs -print -quit)"
          test -n "$MKFS" && test -n "$EXTRACT"
          printf 'Mi_Max Ai EROFS integration test\n' > /tmp/erofs-fixture/src/sub/test.txt
          "$MKFS" -zlz4 /tmp/erofs-fixture/test.erofs /tmp/erofs-fixture/src
          # extract.erofs places the image root under <outdir>/<image-basename>.
          "$EXTRACT" -i /tmp/erofs-fixture/test.erofs -x -f -T2 -o /tmp/erofs-fixture/out
          EROFS_ROOT=/tmp/erofs-fixture/out/test
          test -d "$EROFS_ROOT"
          test -s "$EROFS_ROOT/sub/test.txt"
          cmp /tmp/erofs-fixture/src/sub/test.txt "$EROFS_ROOT/sub/test.txt"

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMaxAi-3.2-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

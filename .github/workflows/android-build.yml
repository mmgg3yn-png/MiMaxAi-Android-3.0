name: Mi_Max Ai 3.0 Android Build
# Rebuild local HTML/Python APK templates after package and alignment fixes

on:
  push:
    branches: [ main, development, 'feature/local-html-python-apk', 'feature/mimaxai-embedded-tool-suite' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimaxai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate PC Bridge Python
        run: python -m py_compile pc-agent/mimax_pc_agent.py && python pc-agent/mimax_pc_agent.py --help

      # Build reusable WebView shells in CI. Actual HTML/Python project APKs are
      # assembled and signed locally on the Android device by Mi_Max Ai.
      - name: Build local HTML and Python runner shells
        run: |
          gradle --no-daemon -p local-runner :app:assembleHtmlDebug :app:assemblePythonDebug
          mkdir -p app/src/main/assets
          cp local-runner/app/build/outputs/apk/html/debug/app-html-debug.apk app/src/main/assets/local_runner_html.apk
          cp local-runner/app/build/outputs/apk/python/debug/app-python-debug.apk app/src/main/assets/local_runner_python.apk

      - name: Test embedded MTK logo.bin engine
        run: |
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -n 1)"
          test -n "$ANDROID_JAR"
          mkdir -p build/logo-bin-tests
          javac -encoding UTF-8 -cp "$ANDROID_JAR" -d build/logo-bin-tests \
            app/src/main/java/com/mimax/ai/engine/Io.java \
            app/src/main/java/com/mimax/ai/engine/LogoBin.java \
            app/src/main/java/com/mimax/ai/engine/Archives.java \
            app/src/main/java/com/mimax/ai/engine/ArchivePack.java \
            engine-tests/LogoBinTest.java
          java -cp "build/logo-bin-tests:$ANDROID_JAR" LogoBinTest build/logo-bin-tests/work

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMaxAi-3.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

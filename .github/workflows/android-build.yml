name: Mi_Max Ai 3.0 Android Build

on:
  push:
    branches: [ main, development, feature/aosp-lp-tools ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimaxai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native build scripts
        run: |
          bash -n tools/build-aosp-lp-tools-android.sh
          python3 - <<'PY'
          from pathlib import Path
          source = Path("tools/build-aosp-lp-tools-android.sh").read_text()
          start = source.index("<<'PY'") + len("<<'PY'")
          end = source.index("\nPY\n", start)
          compile(source[start:end], "lp-tools-build-patcher", "exec")
          print("Native build script syntax is valid.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.3.13750724'

      - name: Build AOSP logical-partition tools for ARM32 and ARM64
        run: bash tools/build-aosp-lp-tools-android.sh

      - name: Validate PC Bridge Python
        run: python -m py_compile pc-agent/mimax_pc_agent.py && python pc-agent/mimax_pc_agent.py --help

      - name: Build local HTML and Python runner templates
        run: |
          gradle --no-daemon -p local-runner :app:assembleHtmlRelease :app:assemblePythonRelease
          mkdir -p app/src/main/assets
          cp local-runner/app/build/outputs/apk/html/release/app-html-release.apk app/src/main/assets/local_runner_html.apk
          cp local-runner/app/build/outputs/apk/python/release/app-python-release.apk app/src/main/assets/local_runner_python.apk

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMaxAi-3.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

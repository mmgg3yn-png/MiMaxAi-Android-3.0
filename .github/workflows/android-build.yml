name: Mi_Max Ai 3.0 Android Build

on:
  push:
    branches: [ main, development, 'feature/mt1-tool-extensions' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimaxai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate PC Bridge Python
        run: python -m py_compile pc-agent/mimax_pc_agent.py && python pc-agent/mimax_pc_agent.py --help

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMaxAi-3.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            chmod 600 ~/.android/debug.keystore
          else
            echo "DEBUG_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi

      - name: Print signing SHA-1 (must match Firebase)
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android | grep -E "SHA1|SHA256" || true
          echo "Expected SHA1 in google-services.json: 89:DB:BC:9C:79:59:7D:3F:67:75:90:A0:8F:D3:97:B1:89:A9:BF:DA"

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMaxAi-Google-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mimax.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.mimax.ai"
        minSdk 26
        targetSdk 34
        versionCode 33
        versionName "3.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


dependencies {
    implementation 'com.android.tools.build:apksig:8.3.0'
}

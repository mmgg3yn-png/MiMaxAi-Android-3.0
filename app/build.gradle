plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mimax.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.mimax.ai"
        minSdk 26
        targetSdk 34
        versionCode 30
        versionName "3.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


dependencies {
    // Sandboxed JavaScript engine for installable .mt1 extensions.
    implementation 'org.mozilla:rhino:1.7.15'
}
